name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-and-test:
    name: Build server + run unit tests
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (headless server + tests, no OpenGL client)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOG_BUILD_GAME=OFF -DOG_BUILD_SERVER=ON -DOG_BUILD_TESTS=ON -DOG_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
