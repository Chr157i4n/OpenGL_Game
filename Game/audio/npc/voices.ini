# ---------------------------------------------------------------------------
# NPC-Stimmen: Live-TTS mit SVOX Pico (keine mp3 Dateien mehr noetig)
# ---------------------------------------------------------------------------
# Sprache : Standardsprache aller Voicelines
#           de-DE, en-US, en-GB, es-ES, fr-FR, it-IT
# speed   : Standardgeschwindigkeit
#           1.0 = normal, 1.2 = schneller und hoeher, 0.8 = langsamer und tiefer
#
# Format einer Voiceline:
#   event = Text | Text2 | Text3
# Der Text nach '|' ist eine weitere Variante, die zufaellig gewaehlt wird.
#
# Optionale Parameter hintern dem Text (mit ';' getrennt):
#   event = Text ; speed=1.1 ; lang=en-US ; ta=audio/npc/en-US_ta.bin ; sg=audio/npc/en-US_lh0_sg.bin
#
# Ein Event spricht, wenn es im Code ausgelost wird:
#   chatter -> Spieler klickt einen NPC an
#   hit     -> NPC wird getroffen
# Neue Events koennen hier einfach eingetragen werden.
# ---------------------------------------------------------------------------

sprache = de-DE
speed = 1.0

# Sprueche, wenn der Spieler einen NPC anspricht
chatter = Hallo. | Guten Tag. | Moin. | Was willst du? | Lass mich in Ruhe. | Ich bin nur vorbeigekommen. | Wie schön, dass du hier bist. | Nichts Neues aus der Stadt. | Baby Schmaybe. | Jo, wie geht es?

# Reaktion, wenn ein NPC getroffen wird
hit = TESTMARKE! | Autsch! | Das tut weh! | Warum schiesst du auf mich? | Ho! | Das war keine gute Idee. | Verdammt!

# Beispiel: andere Sprache oder andere Stimme
# npc_english = Hello there. Nice weather today. ; lang=en-US ; speed=1.0
